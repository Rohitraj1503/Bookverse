<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — BookVerse</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <div id="navbar-root"></div>
        <div class="auth-page">
            <div class="auth-card">
                <div class="text-center">
                    <h2>Create Your <span class="text-gradient">Account</span></h2>
                    <p class="auth-subtitle">Join thousands of book lovers on BookVerse</p>
                </div>
                <form id="registerForm" onsubmit="return handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-input" id="regName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" class="form-input" id="regPhone" placeholder="+1 234 567 890">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="Min 6 characters"
                            required oninput="checkPasswordStrength(this.value)">
                        <div class="password-strength">
                            <div class="bar" id="strengthBar" style="width:0"></div>
                        </div>
                        <p class="form-error" id="strengthText"
                            style="color:var(--text-muted);margin-top:6px;font-size:0.75rem"></p>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" class="form-input" id="regConfirm" placeholder="Re-enter password"
                            required>
                    </div>
                    <label
                        style="display:flex;align-items:flex-start;gap:8px;margin-bottom:24px;font-size:0.85rem;color:var(--text-secondary);cursor:pointer">
                        <input type="checkbox" id="agreeTerms" required style="margin-top:3px">
                        I agree to the <a href="#" style="color:var(--accent-1)">Terms of Service</a> and <a href="#"
                            style="color:var(--accent-1)">Privacy Policy</a>
                    </label>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center"
                        id="regBtn">Create Account</button>
                </form>
                <p style="text-align:center;margin-top:24px;font-size:0.9rem;color:var(--text-secondary)">
                    Already have an account? <a href="login.html" style="color:var(--accent-1);font-weight:600">Sign
                        In</a>
                </p>
            </div>
        </div>
        <div class="bg-orbs">
            <div class="orb"></div>
            <div class="orb"></div>
            <div class="orb"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
