<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Books — BookVerse</title>
    <meta name="description" content="Browse our complete collection of books. Filter by category, price, and rating.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>
    <div id="app">
        <div id="navbar-root"></div>

        <div class="books-page container">
            <!-- Page Header -->
            <div class="books-page__header">
                <div>
                    <h1 class="books-page__title">Explore Our <span class="text-gradient">Collection</span></h1>
                    <p class="books-page__subtitle" id="resultsCount">Showing all books</p>
                </div>
                <div class="books-page__toolbar">
                    <div class="books-page__search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search books, authors...">
                    </div>
                    <div class="books-page__sort">
                        <select id="sortSelect" onchange="applyFilters()">
                            <option value="default">Sort: Default</option>
                            <option value="price-asc">Price: Low → High</option>
                            <option value="price-desc">Price: High → Low</option>
                            <option value="rating">Highest Rated</option>
                            <option value="title">Title A–Z</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="books-page__layout">
                <!-- Sidebar Filters -->
                <aside class="books-page__sidebar" id="filterSidebar">
                    <div class="filter-card">
                        <div class="filter-card__head">
                            <h3>Filters</h3>
                            <button class="filter-card__clear" onclick="clearFilters()">Clear all</button>
                        </div>

                        <!-- Category chips -->
                        <div class="filter-section">
                            <h4 class="filter-section__title">Category</h4>
                            <div class="filter-chips" id="categoryFilters"></div>
                        </div>

                        <!-- Price range -->
                        <div class="filter-section">
                            <h4 class="filter-section__title">Price Range</h4>
                            <div class="price-slider-group">
                                <div class="price-inputs">
                                    <div class="price-field">
                                        <span class="price-field__symbol">$</span>
                                        <input type="number" id="priceMin" placeholder="0" min="0">
                                    </div>
                                    <span class="price-divider">—</span>
                                    <div class="price-field">
                                        <span class="price-field__symbol">$</span>
                                        <input type="number" id="priceMax" placeholder="999" min="0">
                                    </div>
                                </div>
                                <button class="filter-apply-btn" onclick="applyFilters()">Apply Price</button>
                            </div>
                        </div>

                        <!-- Rating pills -->
                        <div class="filter-section">
                            <h4 class="filter-section__title">Rating</h4>
                            <div class="rating-pills" id="ratingFilters">
                                <label class="rating-pill">
                                    <input type="radio" name="rating" value="4" onchange="applyFilters()">
                                    <span class="rating-pill__label">★★★★ & Up</span>
                                </label>
                                <label class="rating-pill">
                                    <input type="radio" name="rating" value="3" onchange="applyFilters()">
                                    <span class="rating-pill__label">★★★ & Up</span>
                                </label>
                                <label class="rating-pill">
                                    <input type="radio" name="rating" value="0" onchange="applyFilters()" checked>
                                    <span class="rating-pill__label">All Ratings</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Book Grid -->
                <main class="books-page__main">
                    <div class="book-grid book-grid--4col" id="bookGrid"></div>
                    <div class="pagination-bar" id="pagination"></div>
                </main>
            </div>
        </div>

        <div id="footer-root"></div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/books.js"></script>
</body>

</html>
